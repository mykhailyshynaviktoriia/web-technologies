<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5 - Віджет погоди</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>

    <div class="weather-widget">
  
        <div class="weather-card weather-bottom">
            <div class="forecast">
                <span>Mon<br><strong>17°</strong></span>
                <span>Tue<br><strong>19°</strong></span>
                <span>Wed<br><strong>16°</strong></span>
                <span>Thu<br><strong>18°</strong></span>
                <span>Fri<br><strong>21°</strong></span>
            </div>
        </div>

        <div class="weather-card weather-main">
            <span class="number">17</span>
        </div>

        <div class="weather-card weather-cloud">
            <div class="cloud-visual"></div>
        </div>

        <div class="weather-arrows">
            <span class="arrow">&larr;</span>
            <span class="arrow">&rarr;</span>
        </div>

    </div>

</body>
</html>
