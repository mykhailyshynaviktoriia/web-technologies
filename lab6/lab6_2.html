<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 - Варіант 5</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .wrapper {
            display: flex;
            gap: 20px;
        }

        .column {
            display: flex;
            flex-direction: column-reverse; 
            align-items: center;
            gap: 15px;
            width: 160px;
        }

        .block-1, .block-2 {
            box-sizing: border-box;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .block-1 {
            width: 160px;
            height: 45px;
            background-color: #00b050;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .block-2 {
            width: 160px;
            height: 140px;
            background-color: #418ab3;
            color: #fff;
            font-size: 16px;
            line-height: 1.3;
            padding: 10px;

            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

     
        .block-1:hover + .block-2 {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <div class="wrapper">
   
        <div class="column">
            <div class="block-1">Блок 1</div>
            <div class="block-2">Текст всередині Блоку 2</div>
        </div>

        <div class="column">
            <div class="block-1">Блок 1</div>
            <div class="block-2">Текст всередині Блоку 2</div>
        </div>

  
        <div class="column">
            <div class="block-1">Блок 1</div>
            <div class="block-2">Текст всередині Блоку 2</div>
        </div>
    </div>

</body>
</html>
