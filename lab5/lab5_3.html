<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Анкета</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <h2>Анкета користувача</h2>

    <form action="" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Особисті дані</legend>
            
            <p>
                <label for="name">Ім'я:</label>
                <input type="text" id="name" name="name" placeholder="Ваше ім'я" required tabindex="1">
            </p>

            <p>
                <label for="bday">Дата народження:</label>
                <input type="date" id="bday" name="bday" required tabindex="2">
            </p>

            <p>
                <label for="mail">Email:</label>
                <input type="email" id="mail" name="mail" placeholder="mail@gmail.com" autocomplete="off" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required tabindex="3">
            </p>

            <p>
                <label for="tel">Телефон:</label>
                <input type="tel" id="tel" name="tel" placeholder="+380XXXXXXXXX" pattern="^\+380\d{9}$" required tabindex="4">
            </p>
        </fieldset>
        <fieldset>
            <legend>Безпека</legend>
            
            <p>
                <label for="pass">Пароль (6 символів, 1 цифра, 1 велика і 1 мала літера):</label>
                <input type="password" id="pass" name="pass" placeholder="Введіть пароль" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,6}" required tabindex="5">
            </p>
        </fieldset>
        <fieldset>
            <legend>Вибір</legend>

            <p>
                <span>Досвід:</span>
                <label><input type="radio" name="exp" value="no" tabindex="6"> Малий</label>
                <label><input type="radio" name="exp" value="mid" tabindex="7"> Середній</label>
                <label><input type="radio" name="exp" value="pro" tabindex="8"> Високий</label>
            </p>

            <p>
                <span>Формат:</span>
                <label><input type="radio" name="form" value="on" tabindex="9"> Онлайн</label>
                <label><input type="radio" name="form" value="off" checked tabindex="10"> Офлайн</label>
                <label><input type="radio" name="form" value="mix" tabindex="11"> Змішаний</label>
            </p>

            <p>
                <span>Мови:</span>
                <label><input type="checkbox" name="l1" value="html" tabindex="12"> HTML</label>
                <label><input type="checkbox" name="l2" value="js" tabindex="13"> JS</label>
                <label><input type="checkbox" name="l3" value="python" tabindex="14"> Python</label>
                <label><input type="checkbox" name="l4" value="cpp" tabindex="15"> C++</label>
            </p>
        </fieldset>
        <fieldset>
            <legend>Списки</legend>

            <p>
                <label for="kurs">Курс:</label>
                <select id="kurs" name="kurs" tabindex="16">
                    <option value="1">1 курс</option>
                    <option value="2">2 курс</option>
                    <option value="3" selected>3 курс</option>
                    <option value="4">4 курс</option>
                    <option value="5">5 курс</option>
                </select>
            </p>

            <p>
                <label for="hobb">Хобі (множинний вибір):</label>
                <select id="hobb" name="hobb" multiple size="3" tabindex="17">
                    <option value="sport">Спорт</option>
                    <option value="music">Музика</option>
                    <option value="read">Читання</option>
                    <option value="games">Ігри</option>
                    <option value="travel">Подорожі</option>
                    <option value="art">Мистецтво</option>
                </select>
            </p>

            <p>
                <label for="genre">Музика (з групами):</label>
                <select id="genre" name="genre" tabindex="18">
                    <optgroup label="Сучасна">
                        <option value="pop">Поп</option>
                        <option value="rap">Реп</option>
                        <option value="hip">Хіп-хоп</option>
                    </optgroup>
                    <optgroup label="Рок">
                        <option value="alt">Альтернатива</option>
                        <option value="ind">Інді</option>
                        <option value="rock">Рок</option>
                    </optgroup>
                    <optgroup label="Електро">
                        <option value="house">Хаус</option>
                        <option value="tech">Техно</option>
                        <option value="synth">Синтез</option>
                    </optgroup>
                    <optgroup label="Спокійна">
                        <option value="lofi">Ло-фай</option>
                        <option value="class">Класика</option>
                        <option value="amb">Ембієнт</option>
                    </optgroup>
                </select>
            </p>

            <p>
                <label for="color">Колір (з підказкою):</label>
                <input list="colors" id="color" name="color" placeholder="Оберіть..." tabindex="19">
                <datalist id="colors">
                    <option value="Червоний">
                    <option value="Синій">
                    <option value="Зелений">
                    <option value="Фіолетовий">
                    <option value="Чорний">
                </datalist>
            </p>
        </fieldset>
        <fieldset>
            <legend>Файли</legend>

            <p>
                <label for="aud">Аудіо:</label>
                <input type="file" id="aud" name="aud" accept="audio/*" multiple tabindex="20">
            </p>

            <p>
                <label for="txt">Про себе:</label><br>
                <textarea id="txt" name="txt" rows="3" placeholder="Текст..." tabindex="21"></textarea>
            </p>
        </fieldset>

        <p style="text-align: center;">
            <button type="submit" tabindex="22">Надіслати</button>
            <button type="reset" tabindex="23">Очистити</button>
        </p>

    </form>

</body>
</html>
