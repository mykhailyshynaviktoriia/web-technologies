<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 4 - Анкета</title>
</head>
<body align="center">
    <h2>Форма анкети (HTML5)</h2>
     <form action="" method="get" enctype="multipart/form-data">
        <fieldset style="width: 500px; margin: 0 auto; text-align: left;">
            <legend>Особисті дані</legend>
            <label for="name">Ім'я:</label><br>
            <input type="text" id="name" name="username" placeholder="Введіть ім'я" required tabindex="1"><br><br>
            <label for="pass">Пароль (6 символів, містить велику, малу літеру та цифру):</label><br>
            <input type="password" id="pass" name="password" placeholder="Пароль" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}" required tabindex="2"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="useremail" placeholder="example@gmail.com" autocomplete="off" required tabindex="3"><br><br>
            <label for="tel">Мобільний номер:</label><br>
            <input type="tel" id="tel" name="usertel" placeholder="+380..." pattern="^\+380\d{9}$" tabindex="4"><br><br>
            <label for="bday">Дата народження:</label><br>
            <input type="date" id="bday" name="birthdate" tabindex="5"><br><br>
            <label>Стать:</label><br>
            <input type="radio" id="r1" name="gender" value="m" checked> <label for="r1">Чоловіча</label>
            <input type="radio" id="r2" name="gender" value="f"> <label for="r2">Жіноча</label><br><br>
            <label>Вподобання (чекбокси):</label><br>
            <input type="checkbox" id="c1" name="h1" value="sport"> <label for="c1">Спорт</label>
            <input type="checkbox" id="c2" name="h2" value="music"> <label for="c2">Музика</label>
            <input type="checkbox" id="c3" name="h3" value="reading"> <label for="c3">Читання</label>
            <input type="checkbox" id="c4" name="h4" value="code"> <label for="c4">Програмування</label><br><br>
            <label for="dropdown">Випадаючий список:</label><br>
            <select id="dropdown" name="city" tabindex="6">
                <option value="1">Київ</option>
                <option value="2">Львів</option>
                <option value="3" selected>Чернівці</option>
                <option value="4">Одеса</option>
                <option value="5">Харків</option>
            </select><br><br>
            <label for="multi">Множинний вибір:</label><br>
            <select id="multi" name="languages" multiple size="3">
                <option value="ua">Українська</option>
                <option value="en">Англійська</option>
                <option value="de">Німецька</option>
                <option value="fr">Французька</option>
                <option value="pl">Польська</option>
                <option value="es">Іспанська</option>
            </select><br><br>
            <label for="audiofile">Завантажити аудіо (кілька файлів):</label><br>
            <input type="file" id="audiofile" name="audios" accept="audio/*" multiple><br><br>
            <label for="bio">Про себе (текстова область):</label><br>
            <textarea id="bio" name="biography" placeholder="Розкажіть про себе..."></textarea><br><br>
            <button type="submit">Надіслати</button>
            <button type="reset">Очистити</button>
        </fieldset>
    </form>
    <br>
    <a href="../index.html">Повернутись на головну</a>
</body>
</html>
